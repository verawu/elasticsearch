apply plugin: 'elasticsearch.esplugin'
apply plugin: 'elasticsearch.internal-yaml-rest-test'

esplugin {
  name = 'field-encryption'
  description = 'Field-level encryption with AES-256-GCM source encryption and HMAC-SHA256 term encryption'
  classname = 'org.elasticsearch.plugin.encryption.FieldEncryptionPlugin'
  licenseFile = layout.settingsDirectory.file('AGPL-3.0+SSPL-1.0+ELASTIC-LICENSE-2.0.txt').asFile
  noticeFile = layout.settingsDirectory.file('NOTICE.txt').asFile
}

restResources {
  restApi {
    include '_common', 'indices', 'index', 'get', 'search', 'ingest'
  }
}

